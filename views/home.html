<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Map Replay (Tick Viewer)</title>
    <style>
        #map-area {
            font-size: 20px;
            font-family: monospace;
            white-space: pre;
            line-height: 1;
            vertical-align: middle;
            letter-spacing: 0;
            padding: 0;
            margin: 0;
        }
        body {
            background: #f8f8f8;
            padding: 0;
            margin: 0;
        }
        #controls {
            margin: 10px 0;
        }
    </style>
</head>
<body>
<h2>Map Replay (Tick by Tick)</h2>
<div id="controls">
    <button onclick="startAnim()">Play</button>
    <button onclick="resetAnim()">Reset</button>
</div>
<div id="map-area">Loading...</div>

<script>
const CELL_EMOJI = {
    0: "⬜️", 1: "🪙", 2: "🍖", 3: "🌲", 4: "🏠",
    5: "🏰", 6: "🚩", 7: "🛖", 99: "👨‍🌾"
};

let tickMaps = [];
let currentTick = 0;
let animTimer = null;
const TICK_DELAY = 200; // ms

function loadTickFile(index) {
    const padded = index.toString().padStart(3, '0');
    return fetch(`../output/ticks/tick_${padded}.txt`)
        .then(resp => {
            if (!resp.ok) return false; // stop if doesnt exists
            return resp.text().then(text => {
                let lines = text.trim().split('\n');
                let mapData = lines.map(line => line.trim().split(/\s+/).map(Number));
                tickMaps.push(mapData);
                return true;
            });
        })
        .catch(err => {
            console.log(`Error loading tick_${padded}.txt`, err);
            return false;
        });
}



function renderTick(index) {
    const map = tickMaps[index];
    if (!map) return;
    let output = "";
    for (let y = 0; y < map.length; y++) {
        for (let x = 0; x < map[y].length; x++) {
            const val = map[y][x];
            output += CELL_EMOJI.hasOwnProperty(val) ? CELL_EMOJI[val] : "❓";
        }
        output += "\n";
    }
    document.getElementById("map-area").textContent = output;
}

async function preloadTicks() {
    let index = 0;
    tickMaps = [];
    while (true) {
        const result = await loadTickFile(index);
        if (!result) break;
        index++;
    }
    currentTick = 0;
    renderTick(0);
}


function startAnim() {
    if (animTimer !== null || tickMaps.length === 0) return;

    function step() {
        if (currentTick >= tickMaps.length) {
            clearTimeout(animTimer);
            animTimer = null;
            return;
        }
        renderTick(currentTick++);
        animTimer = setTimeout(step, TICK_DELAY);
    }

    step();
}

function resetAnim() {
    clearTimeout(animTimer);
    animTimer = null;
    currentTick = 0;
    renderTick(0);
}

// Auto-load on page start
preloadTicks();
</script>
</body>
</html>

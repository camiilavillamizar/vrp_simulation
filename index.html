<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Strategy Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>🗺️ Map Replay Viewer</h2>

    <div id="controls">
        <button onclick="selectStrategy(0)">Strategy 0</button>
        <button onclick="selectStrategy(1)">Strategy 1</button>
        <button onclick="selectStrategy(2)">Strategy 2</button>
    </div>

    <div id="info-bar">
        <span id="tick-counter">Tick = 0</span>
        <span id="strategy-label">No strategy selected</span>
        <span id="right-info"></span>
    </div>

    <div id="tick-controls" class="hidden">
        <div id="top-buttons">
            <button onclick="goToPreviousTick()">◀ Previous</button>
            <button onclick="goToNextTick()">Next ▶</button>
        </div>
        <div id="bottom-button">
            <button class="green-button" onclick="playVillagerPaths()">▶ Play Movement</button>
        </div>
    </div>



    <div id="map-area">Please select a strategy</div>

    <script src="script.js"></script>
</body>
</html>
